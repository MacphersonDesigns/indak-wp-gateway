name: Release connector plugin

# Tag a commit `connector-vX.Y.Z` (matching the Version header and the
# INDAK_GATEWAY_CONNECTOR_VERSION constant in
# wordpress/indak-gateway-connector/indak-gateway-connector.php) and push the tag.
# This packages the plugin folder and attaches indak-gateway-connector.zip to a
# GitHub Release. Three things read that release:
#   - the Indak Partnership Program installer (latest release asset),
#   - the gateway's /connector/release feed, which paired sites use to self-update,
#   - WordPress, which installs the asset when a site updates the connector.
#
# Paired sites install whatever this workflow publishes, so it uses no third-party
# actions: only GitHub's own, pinned to commit SHAs. The build job cannot write to
# the repository; only the small release job can, and it only uploads the zip.
on:
  push:
    tags:
      - "connector-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check the tag matches the plugin version
        run: |
          set -euo pipefail
          plugin=wordpress/indak-gateway-connector/indak-gateway-connector.php
          tag_version="${GITHUB_REF_NAME#connector-v}"
          header_version="$(sed -n 's/^ \* Version: *//p' "$plugin" | tr -d '[:space:]')"
          constant_version="$(sed -n "s/^define('INDAK_GATEWAY_CONNECTOR_VERSION', '\([^']*\)');/\1/p" "$plugin")"
          echo "tag=$tag_version header=$header_version constant=$constant_version"
          if ! [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like connector-v1.2.3"; exit 1
          fi
          if [ "$tag_version" != "$header_version" ] || [ "$tag_version" != "$constant_version" ]; then
            echo "::error::Tag, Version header, and INDAK_GATEWAY_CONNECTOR_VERSION must all match"; exit 1
          fi

      - name: Lint and self-test the connector (runner's preinstalled PHP)
        run: |
          php --version
          bash scripts/connector-lint.sh
          php scripts/connector-credential-selftest.php

      - name: Package plugin zip
        run: |
          set -euo pipefail
          mkdir -p build
          cp -R wordpress/indak-gateway-connector build/indak-gateway-connector
          cd build
          zip -r -X indak-gateway-connector.zip indak-gateway-connector -x '*.DS_Store' -x '__MACOSX/*'
          unzip -l indak-gateway-connector.zip
          sha256sum indak-gateway-connector.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-zip
          path: build/indak-gateway-connector.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: connector-zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" indak-gateway-connector.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
