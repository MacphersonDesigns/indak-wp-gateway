name: Release connector plugin

# Tag a commit `connector-vX.Y.Z` (matching the Version header in
# wordpress/indak-gateway-connector/indak-gateway-connector.php) and push the
# tag. This packages the plugin folder and attaches indak-gateway-connector.zip
# to a GitHub Release so the Indak Partnership Program installer can fetch it.
on:
  push:
    tags:
      - "connector-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugin zip
        run: |
          set -e
          mkdir -p build
          cp -R wordpress/indak-gateway-connector build/indak-gateway-connector
          cd build
          zip -r indak-gateway-connector.zip indak-gateway-connector

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: build/indak-gateway-connector.zip
          generate_release_notes: true
